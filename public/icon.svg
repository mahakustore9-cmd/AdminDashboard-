<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base for Maskable/Standalone -->
  <rect width="512" height="512" rx="104" fill="#0f172a" />

  <!-- Shield Base -->
  <g filter="url(#dropShadow)">
    <path d="M 256 64 C 330 64 400 90 400 160 C 400 300 296 392 256 424 C 216 392 112 300 112 160 C 112 90 182 64 256 64 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="6"/>
  </g>

  <!-- Inner Shield Inset -->
  <path d="M 256 86 C 314 86 376 106 376 164 C 376 282 288 362 256 392 C 224 362 136 282 136 164 C 136 106 198 86 256 86 Z" fill="none" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Academic Cap / Student Safety Icon -->
  <!-- Cap top rhombus -->
  <path d="M 256 150 L 336 186 L 256 222 L 176 186 Z" fill="url(#goldGrad)" stroke="#fef3c7" stroke-width="2"/>
  <!-- Cap skull skull-cap base -->
  <path d="M 204 200 L 204 240 C 204 262 308 262 308 240 L 308 200 Z" fill="#b45309"/>
  <!-- Tassel -->
  <path d="M 336 186 L 348 230 C 348 244 340 252 340 258" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="340" cy="260" r="4" fill="#fbbf24"/>

  <!-- Protective Location / QR Beacon Wave -->
  <path d="M 256 280 L 256 348" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="280" r="10" fill="#38bdf8"/>
  <path d="M 226 270 C 235 258 277 258 286 270" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 206 254 C 222 236 290 236 306 254" stroke="#bfdbfe" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- MAHAKU Badge Text -->
  <text x="256" y="470" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="3">MAHAKU SAFETY</text>
</svg>
